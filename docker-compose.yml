services:
  web:
    build: .
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      <<: &shared-env
        DYNAMODB_ENDPOINT: http://dynamodb:8000
        DYNAMODB_REGION: us-east-1
        DYNAMODB_TABLE: Snap
        S3_ENDPOINT: http://minio:9000
        S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
        S3_REGION: us-east-1
        S3_BUCKET: snap-skills
        S3_ACCESS_KEY: ${MINIO_ROOT_USER:-snaplocal}
        S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-snaplocalpassword}
        CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
        CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
        CLOUDFLARE_CLEF_MODEL: ${CLOUDFLARE_CLEF_MODEL:-@cf/cloudflare/clef-flash}
        ROUTING_PROVIDER: ${ROUTING_PROVIDER:-cloudflare}
        LOCAL_SYSTEMONE_URL: ${LOCAL_SYSTEMONE_URL:-}
        LOCAL_SYSTEMONE_MODEL: ${LOCAL_SYSTEMONE_MODEL:-Cloudflare/clef-flash}
        LOCAL_SYSTEMONE_API_KEY: ${LOCAL_SYSTEMONE_API_KEY:-}
        SKILL_MATCH_THRESHOLD: ${SKILL_MATCH_THRESHOLD:-0.42}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://127.0.0.1:3100/mcp}
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mcp:
    build: ./mcp-service
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    environment:
      <<: *shared-env
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3100
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
  init:
    build: .
    environment: *shared-env
    command: ["sh", "-c", "i=0; until node scripts/create-tables.mjs && node scripts/init-storage.mjs; do i=$$((i+1)); if [ $$i -ge 20 ]; then exit 1; fi; sleep 2; done"]
    depends_on:
      - dynamodb
      - minio
  minio:
    image: cgr.dev/chainguard/minio@sha256:a1d2b3516a41296510f7fb49184c18b88287fa8f35cf3ce5c047289053b94964
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-snaplocal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-snaplocalpassword}
    ports:
      - "${S3_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
  minio-data:
