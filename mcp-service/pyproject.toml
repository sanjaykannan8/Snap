[project]
name = "snap-mcp-service"
version = "1.0.0"
description = "Standalone Snap remote MCP server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "boto3>=1.35,<2", "httpx>=0.27,<1", "python-dotenv>=1,<2", "uvicorn>=0.30,<1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "tiktoken>=0.14.0",
    "typesafe-sdk>=0.7.5",
]
